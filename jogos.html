<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos</title>
    
    <style>
        :root {
            --cor-primaria: #5F0F40;
            --cor-secundaria: #F0A7A0;
            --cor-destaque: #F26CA7;
            --cor-lilas: #CFA0F7;
            --cor-roxo: #A741CF;

            --cor-fundo: #fdf5f7;
            --cor-branco: #ffffff;
            --cor-texto: #333333;
            --cor-texto-secundario: #555555;
            --cor-borda: #dddddd;

            /* Cores derivadas da paleta */
            --cor-fundo-jogo: #fff7f9;
            --cor-borda-jogo: #f7dce4;
            --cor-desabilitado: #d9aeba;
        }


        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            padding: 30px 20px 50px;
            font-family: Arial, sans-serif;
            background: var(--cor-fundo);
            color: var(--cor-texto);
        }


        /* =========================
       LINK VOLTAR
    ========================= */

        .voltar {
            display: block;
            width: fit-content;
            margin: 0 auto 25px;

            color: var(--cor-primaria);
            text-decoration: none;
            font-weight: bold;

            transition: 0.2s;
        }

        .voltar:hover {
            color: var(--cor-destaque);
            transform: translateX(-3px);
        }


        /* =========================
       ÁREA DOS JOGOS
    ========================= */

        .jogos {
            max-width: 700px;
            margin: 0 auto;
        }


        .jogos h2 {
            text-align: center;
            margin: 10px 0 30px;

            color: var(--cor-primaria);
            font-size: 28px;
        }


        /* =========================
       CARD DO JOGO
    ========================= */

        .jogo-card {
            background: var(--cor-branco);

            padding: 30px;

            border-radius: 20px;

            box-shadow: 0 6px 25px rgba(95, 15, 64, 0.10);

            text-align: center;

            border: 1px solid var(--cor-borda-jogo);
        }


        .jogo-card h3 {
            margin-top: 0;
            margin-bottom: 12px;

            font-size: 24px;

            color: var(--cor-destaque);
        }


        .jogo-card p {
            line-height: 1.6;
            color: var(--cor-texto-secundario);
        }


        /* =========================
       ÁREA DO JOGO
    ========================= */

        .jogo {
            margin-top: 25px;
            padding: 25px;

            background: var(--cor-fundo-jogo);

            border-radius: 15px;

            border: 1px solid var(--cor-borda-jogo);
        }


        #chute {
            width: 100%;
            padding: 14px;

            border: 2px solid var(--cor-secundaria);

            border-radius: 10px;

            font-size: 18px;
            text-align: center;

            outline: none;

            transition: 0.2s;
        }


        #chute:focus {
            border-color: var(--cor-destaque);

            box-shadow:
                0 0 0 3px rgba(242, 108, 167, 0.15);
        }


        /* =========================
       BOTÕES
    ========================= */

        .jogo button {
            width: 100%;
            margin-top: 12px;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: var(--cor-destaque);
            color: var(--cor-branco);

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.1s;
        }


        .jogo button:hover {
            background: var(--cor-roxo);
            transform: translateY(-1px);
        }


        .jogo button:active {
            transform: translateY(1px);
        }


        .jogo button:disabled {
            background: var(--cor-desabilitado);

            cursor: not-allowed;

            transform: none;
        }


        /* =========================
       MENSAGEM
    ========================= */

        #mensagem {
            min-height: 30px;
            margin: 20px 0 5px;

            font-size: 17px;
            font-weight: bold;

            color: var(--cor-primaria);
        }


        /* =========================
       BOTÃO NOVO JOGO
    ========================= */

        #novoJogo {
            background: var(--cor-roxo);
        }


        #novoJogo:hover {
            background: var(--cor-primaria);
        }


        /* =========================
       RESPONSIVIDADE
    ========================= */

        @media (max-width: 600px) {

            body {
                padding: 25px 15px 40px;
            }

            .jogos h2 {
                font-size: 23px;
            }

            .jogo-card {
                padding: 20px;
            }

            .jogo {
                padding: 18px;
            }

            .jogo-card h3 {
                font-size: 21px;
            }
        }
    </style>


</head>

<body>
    <a class="voltar" href="./index.html">
        ← Voltar para o formulário
    </a>
    <main class="jogos">
        <section class="numero">

            <h2>🎮 Jogos que fiz pra você ❤️</h2>

            <div class="jogo-card">

                <h3>🔢 Adivinhe o número</h3>

                <p>
                    Eu pensei em um número entre <strong>1 e 100</strong>.
                    Será que você consegue descobrir?
                </p>

                <div class="jogo">

                    <input type="number" id="chute" min="1" max="100" placeholder="Digite seu chute">

                    <button id="botaoChutar" onclick="verificarChute()">
                        Chutar 🎯
                    </button>

                    <p id="mensagem"></p>

                    <button id="novoJogo" onclick="iniciarJogo()" style="display: none;">
                        Jogar novamente ❤️
                    </button>

                </div>

            </div>
        </section>

    </main>


    <script>

        let numeroSecreto;
        let tentativa;

        function iniciarJogo() {

            numeroSecreto = Math.floor(Math.random() * 100) + 1;
            tentativa = 0;

            document.getElementById("mensagem").textContent =
                "Estou pensando em um número... 👀";

            document.getElementById("chute").value = "";

            document.getElementById("novoJogo").style.display = "none";

            document.getElementById("chute").disabled = false;
            document.getElementById("botaoChutar").disabled = false;
        }


        function verificarChute() {

            const input = document.getElementById("chute");
            const mensagem = document.getElementById("mensagem");

            const chute = Number(input.value);

            if (!chute || chute < 1 || chute > 100) {

                mensagem.textContent =
                    "Escolhe um número entre 1 e 100 😌";

                return;
            }

            tentativa++;

            if (chute < numeroSecreto) {

                mensagem.textContent =
                    `Tentativa ${tentativa}: tente um número maior 📈`;

            } else if (chute > numeroSecreto) {

                mensagem.textContent =
                    `Tentativa ${tentativa}: tente um número menor 📉`;

            } else {

                mensagem.textContent =
                    `ACERTOU! 🎉 Você precisou de ${tentativa} tentativa(s)! ❤️`;

                input.disabled = true;
                document.getElementById("botaoChutar").disabled = true;

                document.getElementById("novoJogo").style.display = "block";
            }
        }


        iniciarJogo();

    </script>


</body>

</html>
